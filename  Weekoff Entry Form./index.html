<!DOCTYPE html>
<html>

<head>
    <title>Work Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <h2>Add Work Calendar</h2>

        <div class="top-option">
            <input type="checkbox" id="half">
            <label for="half">Half working day & half weekend</label>
        </div>

        <div class="calendar">
            <div class="header">
                <div></div>
                <div>1st</div>
                <div>2nd</div>
                <div>3rd</div>
                <div>4th</div>
                <div>5th</div>
            </div>

            <div class="row">
                <div class="day">Sunday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Monday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Tuesday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Wednesday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Thursday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Friday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

            <div class="row">
                <div class="day">Saturday</div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>

        </div>

        <div class="buttons">
            <button class="save">Save</button>
            <button class="cancel">Cancel</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
