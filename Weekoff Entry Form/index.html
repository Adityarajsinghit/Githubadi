<!DOCTYPE html>
<html>

<head>
    <title>Employee Weekoff Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Employee Weekoff Form</h2>

        <form>
            <label>Employee Name</label>
            <input type="text" id="name" placeholder="Enter your namme">

            <label>Employee ID</label>
            <input type="text" id="empid" placeholder="Enter your employee ID">

            <label>Weekoff Date</label>
            <input type="date" id="date">

            <label>Reason</label>
            <textarea id="reason" placeholder="Enter the reason.."></textarea>

            <button type="button" onclick="submitForm()">Submit</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
